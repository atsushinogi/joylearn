<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クリック記録</title>
  <style>
    * { box-sizing: border-box; cursor: crosshair; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #fff; }
    body { font-family: system-ui, sans-serif; color: #1f2937; }
    #click-area { min-height: 100vh; }
    #records-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(440px, 100vw);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-left: 1px solid #d1d5db;
      box-shadow: -4px 0 18px #0000000d;
    }
    .panel-header { padding: 18px 20px 14px; border-bottom: 1px solid #e5e7eb; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    #clear-button {
      padding: 7px 11px;
      border: 1px solid #b91c1c;
      border-radius: 6px;
      background: #fff;
      color: #b91c1c;
      font: inherit;
      font-size: 13px;
    }
    #clear-button:hover:not(:disabled) { background: #fef2f2; }
    #clear-button:disabled { opacity: .45; }
    .hint { margin: 10px 0 0; color: #6b7280; font-size: 12px; }
    #status { min-height: 18px; margin: 8px 0 0; color: #b91c1c; font-size: 12px; }
    .table-wrap { flex: 1; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap; }
    th { position: sticky; top: 0; background: #f9fafb; font-weight: 600; }
    td:nth-child(1), td:nth-child(3), td:nth-child(4) { font-variant-numeric: tabular-nums; }
    #empty { padding: 20px; color: #6b7280; font-size: 13px; }
    @media (max-width: 700px) {
      #records-panel {
        top: auto;
        bottom: 0;
        width: 100%;
        height: 42vh;
        height: 42dvh;
        border-left: 0;
        border-top: 1px solid #d1d5db;
        box-shadow: 0 -4px 18px #0000000d;
      }
    }
  </style>
</head>
<body>
  <main id="click-area" aria-label="クリックを記録する領域"></main>
  <aside id="records-panel" aria-label="保存済みクリック">
    <div class="panel-header">
      <div class="panel-title">
        <h1>クリック履歴 <span id="count">0</span> 件</h1>
        <button id="clear-button" type="button" disabled>全削除</button>
      </div>
      <p class="hint">白い領域をクリックすると記録します。座標は画面左上基準です。履歴はこのブラウザに保存されます。</p>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>ID</th><th>時刻 (UTC)</th><th>X</th><th>Y</th></tr></thead>
        <tbody id="records"></tbody>
      </table>
      <div id="empty">読み込み中...</div>
    </div>
  </aside>
  <script>
    const storageKey = "click-recorder-clicks-v1";
    const clickArea = document.getElementById("click-area");
    const clearButton = document.getElementById("clear-button");
    const count = document.getElementById("count");
    const records = document.getElementById("records");
    const empty = document.getElementById("empty");
    const status = document.getElementById("status");
    let clicks = [];
    let storageReady = false;

    function loadClicks() {
      const saved = localStorage.getItem(storageKey);
      if (saved === null) return [];
      const value = JSON.parse(saved);
      if (!Array.isArray(value) || !value.every(click =>
        click && Number.isSafeInteger(click.id) && click.id > 0 &&
        typeof click.clicked_at === "string" &&
        Number.isFinite(click.x) && click.x >= 0 &&
        Number.isFinite(click.y) && click.y >= 0
      )) {
        throw new Error("保存データを読み込めませんでした");
      }
      return value;
    }

    function renderRecords() {
      const fragment = document.createDocumentFragment();
      for (const click of [...clicks].reverse()) {
        const row = document.createElement("tr");
        for (const value of [click.id, click.clicked_at, click.x, click.y]) {
          const cell = document.createElement("td");
          cell.textContent = String(value);
          row.append(cell);
        }
        fragment.append(row);
      }
      records.replaceChildren(fragment);
      count.textContent = String(clicks.length);
      empty.textContent = "記録はありません";
      empty.hidden = clicks.length !== 0;
      clearButton.disabled = !storageReady || clicks.length === 0;
    }

    clickArea.addEventListener("click", (event) => {
      if (!storageReady) return;
      try {
        const current = loadClicks();
        const nextId = current.length ? current[current.length - 1].id + 1 : 1;
        const click = {
          id: nextId,
          clicked_at: new Date().toISOString(),
          x: event.clientX,
          y: event.clientY
        };
        const updated = [...current, click];
        localStorage.setItem(storageKey, JSON.stringify(updated));
        clicks = updated;
        renderRecords();
        status.textContent = "";
      } catch (error) {
        status.textContent = "クリックを保存できませんでした: " + error.message;
        console.error(error);
      }
    });

    clearButton.addEventListener("click", () => {
      if (!window.confirm("保存されたクリック履歴をすべて削除しますか？")) return;
      try {
        localStorage.removeItem(storageKey);
        clicks = [];
        renderRecords();
        status.textContent = "";
      } catch (error) {
        status.textContent = "履歴を削除できませんでした: " + error.message;
        console.error(error);
      }
    });

    window.addEventListener("storage", (event) => {
      if (event.key !== storageKey && event.key !== null) return;
      try {
        clicks = loadClicks();
        renderRecords();
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
        console.error(error);
      }
    });

    try {
      clicks = loadClicks();
      storageReady = true;
      renderRecords();
    } catch (error) {
      empty.textContent = "履歴を読み込めませんでした";
      status.textContent = error.message;
      console.error(error);
    }
  </script>
</body>
</html>
